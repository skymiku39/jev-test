[project]
name = "streamsuite-laya-mre"
version = "0.1.0"
description = "Minimal, offline-reproducible rules -> Laya typed decision -> policy merge pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
model = [
    "huggingface-hub>=0.20",
    "laya",
    "torch",
]

[project.scripts]
laya-mre = "laya_flow.cli:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
